<!doctype html>
<html lang="es-ES">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Panel de certificados | En Su Presencia</title><link rel="icon" type="image/png" href="https://www.ensupresencia.es/wp-content/uploads/2025/04/logo_nuevo_VALENCIA.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#182b4b;font-family:Montserrat,Arial,sans-serif;padding:24px}.shell{width:min(1180px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:48px;height:48px;object-fit:contain;border-radius:8px}.brand strong{display:block;font-size:20px}.brand span{font-size:12px;color:#71809a}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 14px 40px rgba(24,43,75,.08);padding:22px}.auth{display:flex;gap:10px;align-items:end}.auth label{flex:1;font-size:12px;font-weight:700}.auth input{display:block;width:100%;margin-top:6px;padding:12px;border:1px solid #ccd5e2;border-radius:10px;font:inherit}.button{border:0;border-radius:10px;padding:12px 17px;background:#182b4b;color:#fff;font:700 13px Montserrat;cursor:pointer}.button.secondary{background:#fff;color:#182b4b;border:1px solid #ccd5e2}.stats{display:flex;gap:12px;margin:20px 0}.stat{background:#f8fafc;border:1px solid #e6ebf2;border-radius:12px;padding:14px 18px}.stat b{display:block;font-size:24px}.stat span{font-size:11px;color:#71809a}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.search{flex:1;padding:12px 14px;border:1px solid #ccd5e2;border-radius:10px;font:inherit}.table-wrap{overflow:auto;border:1px solid #e4e9f0;border-radius:12px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:13px 14px;border-bottom:1px solid #edf0f4;font-size:13px}th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#71809a;background:#f8fafc}tr:last-child td{border-bottom:0}.status{font-size:11px;font-weight:700;padding:5px 8px;border-radius:20px;background:#eff7ff;color:#25689c}.empty{text-align:center;color:#71809a;padding:35px}.error{display:none;color:#a62b2b;background:#fff0f0;border:1px solid #f2c6c6;border-radius:10px;padding:11px;margin:12px 0;font-size:13px}.muted{color:#71809a;font-size:12px}@media(max-width:700px){body{padding:12px}.top,.toolbar,.auth{align-items:stretch;flex-direction:column}.auth .button{width:100%}.stats{overflow:auto}.card{padding:16px}}
</style></head>
<body><div class="shell">
<div class="top"><div class="brand"><img src="https://www.ensupresencia.es/wp-content/uploads/2025/04/logo_nuevo_VALENCIA.png" alt="En Su Presencia"><div><strong>Panel de certificados</strong><span>En Su Presencia · Gestión de bautismos</span></div></div><a class="button secondary" href="/">← Generar certificados</a></div>
<div class="card"><div class="auth"><label>Clave de administración<input id="token" type="password" placeholder="ADMIN_TOKEN"></label><button id="load" class="button">Entrar y cargar</button></div><div id="error" class="error"></div></div>
<div id="content" hidden><div class="stats"><div class="stat"><b id="total">0</b><span>Total</span></div><div class="stat"><b id="bulk">0</b><span>Cargas masivas</span></div><div class="stat"><b id="individual">0</b><span>Individuales</span></div></div>
<div class="card"><div class="toolbar"><input id="search" class="search" placeholder="Buscar por nombre…"><button id="refresh" class="button secondary">Actualizar</button></div><div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Origen</th><th>Plantilla</th><th>Creado</th><th>Acción</th></tr></thead><tbody id="rows"></tbody></table></div><div id="empty" class="empty" hidden>No hay certificados todavía.</div></div></div>
</div>
<script>
const $=id=>document.getElementById(id);let token='',items=[];
function showError(msg){$('error').textContent=msg;$('error').style.display='block'}
async function loadItems(){const res=await fetch('/api/certificates',{headers:{'x-admin-token':token}});const data=await res.json();if(!res.ok)throw new Error(data.error||'No autorizado');items=data;$('content').hidden=false;render()}
function render(){const q=$('search').value.trim().toLowerCase();const filtered=items.filter(x=>(x.data?.name||'').toLowerCase().includes(q));$('rows').innerHTML=filtered.map(x=>{const name=x.data?.name||'Sin nombre';const source=x.data?.source==='bulk'?'Lista':'Individual';const date=x.created_at?new Date(x.created_at.replace(' ','T')+'Z').toLocaleString('es-ES'):'—';return `<tr><td><strong>${escapeHtml(name)}</strong></td><td><span class="status">${source}</span></td><td>${escapeHtml(x.template_id||'—')}</td><td class="muted">${date}</td><td><a class="button secondary" href="/editor?name=${encodeURIComponent(name)}&certificate=${encodeURIComponent(x.id)}">Abrir editor</a></td></tr>`}).join('');$('empty').hidden=filtered.length>0;$('total').textContent=items.length;$('bulk').textContent=items.filter(x=>x.data?.source==='bulk').length;$('individual').textContent=items.filter(x=>x.data?.source!=='bulk').length}
function escapeHtml(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
$('load').onclick=async()=>{token=$('token').value.trim();$('error').style.display='none';if(!token){showError('Introduce la clave de administración.');return}try{await loadItems()}catch(e){showError(e.message)}};$('refresh').onclick=async()=>{try{await loadItems()}catch(e){showError(e.message)}};$('search').oninput=render;
</script></body></html>
